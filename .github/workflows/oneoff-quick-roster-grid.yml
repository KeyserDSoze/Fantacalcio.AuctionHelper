name: One-off quick roster grid integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-quick-roster-grid.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wire quick roster add flow
        shell: python
        run: |
          from pathlib import Path

          hook = Path('src/hooks/useAuctionData.ts')
          text = hook.read_text()
          if 'import { ROLE_LIMITS } from "@/types";' not in text:
              text = text.replace('import type { AppSnapshot, AuctionState, FantasyTeam, ObservedBid, PendingPriceUpdate, Player, Purchase, SerieAClub } from "@/types";\n', 'import type { AppSnapshot, AuctionState, FantasyTeam, ObservedBid, PendingPriceUpdate, Player, Purchase, SerieAClub } from "@/types";\nimport { ROLE_LIMITS } from "@/types";\n', 1)
          marker = '  const addBid = async (bid: ObservedBid) => {'
          quick_add = '''  const quickAddPurchase = async (teamId: string, playerId: string, amount: number | null) => {\n    if (!data) return;\n    const player = data.players.find((item) => item.id === playerId && item.status === "AVAILABLE");\n    const team = data.teams.find((item) => item.id === teamId);\n    if (!player || !team) return;\n\n    const packageMode = player.role === "P" && data.auction.goalkeeperMode === "PACKAGE";\n    const groupPlayers = packageMode\n      ? data.players\n          .filter((item) => item.status === "AVAILABLE" && item.role === "P" && item.club === player.club)\n          .sort((a, b) => b.basePrice - a.basePrice)\n          .slice(0, 3)\n      : [player];\n    if (packageMode && groupPlayers.length < 2) return;\n\n    const currentRoleCount = data.purchases.filter((purchase) => purchase.fantasyTeamId === teamId && purchase.role === player.role).length;\n    if (currentRoleCount + groupPlayers.length > ROLE_LIMITS[player.role]) return;\n\n    const minimum = packageMode ? (groupPlayers[0]?.basePrice ?? player.basePrice) : player.basePrice;\n    if (amount !== null && (!Number.isFinite(amount) || amount < minimum)) return;\n\n    const liveRole = player.role === data.auction.currentRole;\n    const choiceNumber = liveRole ? data.auction.choiceNumber : 1;\n    const subRound = liveRole ? data.auction.subRound : 1;\n    const now = Date.now();\n    let newPurchases: Purchase[] = [];\n    let updatedPlayers: Player[] = [];\n\n    if (packageMode) {\n      const bundleId = `gk-${now}-${teamId}-${player.club}`;\n      const bundleLabel = `Pacchetto ${player.club}`;\n      newPurchases = groupPlayers.map((item, index) => ({\n        id: `${bundleId}-${item.id}`,\n        playerId: item.id,\n        fantasyTeamId: teamId,\n        price: index === 0 ? (amount ?? 0) : 0,\n        budgetImpact: index === 0 ? (amount ?? 0) : 0,\n        pricePending: index === 0 ? amount === null : false,\n        bundleId,\n        bundleLabel,\n        role: "P",\n        choiceNumber,\n        subRound,\n        timestamp: now + index,\n      }));\n      updatedPlayers = groupPlayers.map((item, index) => ({\n        ...item,\n        status: "WON" as const,\n        ownerId: teamId,\n        purchasePrice: amount === null ? undefined : (index === 0 ? amount : 0),\n      }));\n      await persistPurchaseBundle(newPurchases, updatedPlayers);\n    } else {\n      const purchase: Purchase = {\n        id: `${now}-${player.id}`,\n        playerId: player.id,\n        fantasyTeamId: teamId,\n        price: amount ?? 0,\n        budgetImpact: amount ?? 0,\n        pricePending: amount === null,\n        role: player.role,\n        choiceNumber,\n        subRound,\n        timestamp: now,\n      };\n      const updatedPlayer: Player = {\n        ...player,\n        status: "WON",\n        ownerId: teamId,\n        purchasePrice: amount === null ? undefined : amount,\n      };\n      newPurchases = [purchase];\n      updatedPlayers = [updatedPlayer];\n      await persistPurchase(purchase, updatedPlayer);\n    }\n\n    let nextAuction = data.auction;\n    if (liveRole && !data.auction.resolvedTeamIds.includes(teamId)) {\n      nextAuction = { ...data.auction, resolvedTeamIds: [...data.auction.resolvedTeamIds, teamId] };\n      await saveAuctionState(nextAuction);\n    }\n\n    const updated = new Map(updatedPlayers.map((item) => [item.id, item]));\n    setData((current) => current ? {\n      ...current,\n      auction: nextAuction,\n      purchases: [...current.purchases, ...newPurchases],\n      players: current.players.map((item) => updated.get(item.id) ?? item),\n    } : current);\n  };\n'''
          if 'const quickAddPurchase = async' not in text:
              if marker not in text:
                  raise SystemExit('addBid marker not found')
              text = text.replace(marker, quick_add + marker, 1)
          if '    quickAddPurchase,\n' not in text:
              text = text.replace('    editPurchase,\n    addBid,', '    editPurchase,\n    quickAddPurchase,\n    addBid,', 1)
          hook.write_text(text)

          auction = Path('src/pages/AuctionPage.tsx')
          text = auction.read_text()
          text = text.replace('  onEditPurchase,\n  onUndoPurchase,\n}: {', '  onEditPurchase,\n  onUndoPurchase,\n  onQuickAdd,\n}: {', 1)
          text = text.replace('  onUndoPurchase: (purchase: Purchase) => Promise<void>;\n}) {', '  onUndoPurchase: (purchase: Purchase) => Promise<void>;\n  onQuickAdd: (teamId: string, playerId: string, amount: number | null) => Promise<void>;\n}) {', 1)
          old = '<RosterModal data={data} teamId={rosterTeamId} onOpenChange={(open) => { if (!open) setRosterTeamId(""); }} onEditPurchase={onEditPurchase} onUndoPurchase={onUndoPurchase} />'
          new = '<RosterModal data={data} teamId={rosterTeamId} onOpenChange={(open) => { if (!open) setRosterTeamId(""); }} onTeamChange={setRosterTeamId} onEditPurchase={onEditPurchase} onUndoPurchase={onUndoPurchase} onQuickAdd={onQuickAdd} />'
          if old not in text:
              raise SystemExit('RosterModal invocation not found')
          auction.write_text(text.replace(old, new, 1))

          app = Path('src/App.tsx')
          text = app.read_text()
          old = 'onEditPurchase={api.editPurchase} onUndoPurchase={api.undoPurchase} />}'
          new = 'onEditPurchase={api.editPurchase} onUndoPurchase={api.undoPurchase} onQuickAdd={api.quickAddPurchase} />}'
          if old not in text:
              raise SystemExit('AuctionPage props not found in App')
          app.write_text(text.replace(old, new, 1))
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useAuctionData.ts src/pages/AuctionPage.tsx src/App.tsx
          git commit -m "feat: wire spreadsheet roster quick add"
          git push
