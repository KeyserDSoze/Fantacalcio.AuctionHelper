name: One-off goalkeeper bundle value fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-bundle-value-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch bundle pricing semantics
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'src/lib/strategy.ts': [
                  (
                      'return goalkeeperPackage(allPlayers, player).reduce((sum, item) => sum + item.basePrice, 0);',
                      'return goalkeeperPackage(allPlayers, player)[0]?.basePrice ?? player.basePrice;'
                  ),
                  (
                      'const base = group.reduce((sum, item) => sum + (players.find((player) => player.id === item.playerId)?.basePrice ?? 0), 0);',
                      'const base = Math.max(0, ...group.map((item) => players.find((player) => player.id === item.playerId)?.basePrice ?? 0));'
                  ),
              ],
              'src/lib/analytics.ts': [
                  (
                      'const base = group.reduce((sum, purchase) => sum + (playerMap.get(purchase.playerId)?.basePrice ?? 0), 0);',
                      'const base = Math.max(0, ...group.map((purchase) => playerMap.get(purchase.playerId)?.basePrice ?? 0));'
                  ),
              ],
              'src/pages/PendingPricesPage.tsx': [
                  (
                      'return group.reduce((sum, item) => sum + (data.players.find((player) => player.id === item.playerId)?.basePrice ?? 0), 0);',
                      'return Math.max(0, ...group.map((item) => data.players.find((player) => player.id === item.playerId)?.basePrice ?? 0));'
                  ),
              ],
              'src/pages/MarketPage.tsx': [
                  (
                      'const baseReference = bundle.reduce((sum, item) => sum + (data.players.find((player) => player.id === item.playerId)?.basePrice ?? 0), 0);',
                      'const baseReference = Math.max(0, ...bundle.map((item) => data.players.find((player) => player.id === item.playerId)?.basePrice ?? 0));'
                  ),
              ],
              'src/pages/PlayersPage.tsx': [
                  (
                      '.sort((a, b) => b.players.reduce((sum, player) => sum + player.basePrice, 0) - a.players.reduce((sum, player) => sum + player.basePrice, 0));',
                      '.sort((a, b) => (b.players[0]?.basePrice ?? 0) - (a.players[0]?.basePrice ?? 0));'
                  ),
              ],
              'src/pages/AuctionPage.tsx': [
                  (
                      'const selectedMinPrice = packageMode ? selectedPackage.reduce((sum, player) => sum + player.basePrice, 0) : selectedPlayer?.basePrice ?? 1;',
                      'const selectedMinPrice = packageMode ? selectedPackage[0]?.basePrice ?? 1 : selectedPlayer?.basePrice ?? 1;'
                  ),
                  (
                      'const selectedBidMinPrice = packageMode ? selectedBidPackage.reduce((sum, player) => sum + player.basePrice, 0) : selectedBidPlayer?.basePrice ?? 1;',
                      'const selectedBidMinPrice = packageMode ? selectedBidPackage[0]?.basePrice ?? 1 : selectedBidPlayer?.basePrice ?? 1;'
                  ),
                  (
                      'const quickMinPrice = quickPackage.reduce((sum, player) => sum + player.basePrice, 0);',
                      'const quickMinPrice = packageMode ? quickPackage[0]?.basePrice ?? 0 : quickPlayer?.basePrice ?? 0;'
                  ),
                  (
                      'const minimum = pack.reduce((sum, item) => sum + item.basePrice, 0);',
                      'const minimum = packageMode ? pack[0]?.basePrice ?? player.basePrice : player.basePrice;'
                  ),
                  (
                      'const base = packageMode ? goalkeeperPackage(data.players, candidate.player).reduce((sum, player) => sum + player.basePrice, 0) : candidate.player.basePrice;',
                      'const base = packageMode ? goalkeeperPackage(data.players, candidate.player)[0]?.basePrice ?? candidate.player.basePrice : candidate.player.basePrice;'
                  ),
                  (
                      'const base = pack.reduce((sum, item) => sum + item.basePrice, 0);',
                      'const base = packageMode ? pack[0]?.basePrice ?? player.basePrice : player.basePrice;'
                  ),
              ],
          }

          changed = []
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
              if text != original:
                  changed.append(filename)

          if not changed:
              raise SystemExit('No changes made')

          print('Patched:', ', '.join(changed))
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/strategy.ts src/lib/analytics.ts src/pages/AuctionPage.tsx src/pages/PlayersPage.tsx src/pages/PendingPricesPage.tsx src/pages/MarketPage.tsx
          git commit -m "fix: value goalkeeper bundles by top keeper"
          git push
