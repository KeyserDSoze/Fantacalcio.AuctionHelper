name: One-off roster modal integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-roster-modal-integration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wire roster modals into auction page
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/AuctionPage.tsx')
          text = path.read_text()
          replacements = [
            (
              'import { Select } from "@/components/ui/select";\n',
              'import { Select } from "@/components/ui/select";\nimport { RosterModal } from "@/components/RosterModal";\n'
            ),
            (
              '  onBid,\n  onOpenPrices,\n}: {',
              '  onBid,\n  onOpenPrices,\n  onEditPurchase,\n  onUndoPurchase,\n}: {'
            ),
            (
              '  onBid: (bid: ObservedBid) => Promise<void>;\n  onOpenPrices: () => void;\n}) {',
              '  onBid: (bid: ObservedBid) => Promise<void>;\n  onOpenPrices: () => void;\n  onEditPurchase: (purchase: Purchase, nextTeamId: string, amount: number | null) => Promise<void>;\n  onUndoPurchase: (purchase: Purchase) => Promise<void>;\n}) {'
            ),
            (
              '  const [quickError, setQuickError] = useState("");\n',
              '  const [quickError, setQuickError] = useState("");\n  const [rosterTeamId, setRosterTeamId] = useState("");\n'
            ),
            (
              '      <div className="flex flex-col gap-2 sm:flex-row sm:items-center">\n        {pendingPriceCount > 0 &&',
              '      <div className="flex flex-col gap-2 sm:flex-row sm:items-center">\n        <Button variant="outline" className="min-h-11" onClick={() => setRosterTeamId("soze-heaven")}>La mia rosa</Button>\n        {pendingPriceCount > 0 &&'
            ),
            (
              '<Card><CardHeader><CardTitle>Stato squadre</CardTitle></CardHeader><CardContent className="space-y-2">{snapshots.map((team) => <div key={team.id} className={`flex items-center justify-between gap-3 rounded-lg border p-3 ${activeIds.has(team.id) ? "border-primary/30 bg-primary/5" : "opacity-65"}`}><div className="min-w-0"><div className="truncate text-sm font-semibold">{team.name}</div><div className="text-xs text-muted-foreground">{activeIds.has(team.id) ? "Ancora attivo" : "Risolto / fuori fase"}{team.pendingPrices ? ` · ${team.pendingPrices} prezzo/i mancanti` : ""}</div></div><div className="flex shrink-0 items-center gap-2"><Coins className="h-4 w-4 text-muted-foreground" /><span className="font-bold tabular">{money(team.remaining)}</span></div></div>)}</CardContent></Card>',
              '<Card><CardHeader><CardTitle>Stato squadre</CardTitle></CardHeader><CardContent className="space-y-2">{snapshots.map((team) => <button type="button" key={team.id} onClick={() => setRosterTeamId(team.id)} className={`flex min-h-14 w-full items-center justify-between gap-3 rounded-lg border p-3 text-left transition hover:border-primary/50 hover:bg-accent/40 ${activeIds.has(team.id) ? "border-primary/30 bg-primary/5" : "opacity-75"}`}><div className="min-w-0"><div className="truncate text-sm font-semibold">{team.name}{team.isMe ? " · NOI" : ""}</div><div className="text-xs text-muted-foreground">{activeIds.has(team.id) ? "Ancora attivo" : "Risolto / fuori fase"}{team.pendingPrices ? ` · ${team.pendingPrices} prezzo/i mancanti` : ""} · clicca per la rosa</div></div><div className="flex shrink-0 items-center gap-2"><Coins className="h-4 w-4 text-muted-foreground" /><span className="font-bold tabular">{money(team.remaining)}</span></div></button>)}</CardContent></Card>'
            ),
            (
              '    <Dialog open={Boolean(quickPlayerId)} onOpenChange={(open) => { if (!open) closeQuickAssign(); }}>',
              '    <RosterModal data={data} teamId={rosterTeamId} onOpenChange={(open) => { if (!open) setRosterTeamId(""); }} onEditPurchase={onEditPurchase} onUndoPurchase={onUndoPurchase} />\n\n    <Dialog open={Boolean(quickPlayerId)} onOpenChange={(open) => { if (!open) closeQuickAssign(); }}>'
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected AuctionPage snippet not found: {old[:120]}')
            text = text.replace(old, new, 1)
          path.write_text(text)

          app = Path('src/App.tsx')
          text = app.read_text()
          old = '{page === "auction" && <AuctionPage data={data} onAuction={api.updateAuction} onPurchase={api.addPurchase} onPurchaseBundle={api.addPurchaseBundle} onBid={api.addBid} onOpenPrices={() => setPage("prices")} />}'
          new = '{page === "auction" && <AuctionPage data={data} onAuction={api.updateAuction} onPurchase={api.addPurchase} onPurchaseBundle={api.addPurchaseBundle} onBid={api.addBid} onOpenPrices={() => setPage("prices")} onEditPurchase={api.editPurchase} onUndoPurchase={api.undoPurchase} />}'
          if old not in text:
            raise SystemExit('Expected App AuctionPage invocation not found')
          app.write_text(text.replace(old, new, 1))
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AuctionPage.tsx src/App.tsx
          git commit -m "feat: open and edit rosters from auction desk"
          git push
